/* Layout: ruhige weiße Fläche und graue Karten wie im Mockup. Übersicht = Bildraster, Detail = Lesespalte mit aufklappbaren Sektionen. Bewusst nur hell. */
:root {

  <main id="view"></main>
</div>

<input type="file" id="datei" class="sr" tabindex="-1" aria-hidden="true">

<div class="modal" id="modal" hidden>
  <div class="modal-card" id="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-titel" tabindex="-1">
    <h2 id="modal-titel"></h2>
    <p class="modal-text" id="modal-text"></p>
    <div class="modal-aktionen" id="modal-aktionen"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =====================================================================
   MÖBELWISSEN – App
   Alle Inhalte kommen aus der Wissensdatei (moebelwissen-vX-JJJJ-MM-TT.json).
   Die App speichert den eingespielten Stand dauerhaft auf dem Gerät.
   Textformat in der Datei:
     {Text}        offener Platzhalter
     {!Text}       grauer Warnhinweis mit Popup hinter dem Wort davor
     [Text](URL)   Link
     Leerzeile     neuer Absatz
   ===================================================================== */
(function () {
  const view = document.getElementById("view");
  const wrap = document.getElementById("wrap");
  const leiste = document.getElementById("leiste");
  const leisteTitel = document.getElementById("leiste-titel");
  const dateiInput = document.getElementById("datei");
  const modal = document.getElementById("modal");
  const toastEl = document.getElementById("toast");
  const SPEICHER_ZU = "moebelwissen.zugeklappt";

  let STAND = null;      // { version, datum }
  let ENTWURF = false;   // true = Vorschau eines Entwurfs, kein Import
  let MOEBEL = [];
  let SEKTIONEN = [];
  let bildUrls = [];
  let titelBeobachter = null;

  const state = { q: "", kat: "Alle", scrollY: 0, ansicht: null, zu: new Set(zuLaden()) };

  function zuLaden() {
    try { return JSON.parse(localStorage.getItem(SPEICHER_ZU) || "[]"); } catch (e) { return []; }
  }
  function zuSpeichern() {
    try { localStorage.setItem(SPEICHER_ZU, JSON.stringify([...state.zu])); } catch (e) {}
  }

  /* ---------- Speicher auf dem Gerät (IndexedDB) ---------- */
  const DB_NAME = "moebelwissen-daten", DB_STORE = "stand", DB_KEY = "aktuell";
  function dbOeffnen() {
    return new Promise((ok, fehler) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
      r.onsuccess = () => ok(r.result);
      r.onerror = () => fehler(r.error);
    });
  }
  async function standLaden() {
    try {
      const db = await dbOeffnen();
      return await new Promise((ok, fehler) => {
        const q = db.transaction(DB_STORE, "readonly").objectStore(DB_STORE).get(DB_KEY);
        q.onsuccess = () => ok(q.result || null);
        q.onerror = () => fehler(q.error);
      });
    } catch (e) { return null; }
  }
  async function standSpeichern(daten) {
    const db = await dbOeffnen();
    await new Promise((ok, fehler) => {
      const tx = db.transaction(DB_STORE, "readwrite");
      tx.objectStore(DB_STORE).put(daten, DB_KEY);
      tx.oncomplete = ok;
      tx.onerror = () => fehler(tx.error);
    });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }

  /* ---------- Hilfsfunktionen ---------- */
  const ESC = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ESC[c]);
  const eur = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  const preis = (p) => (typeof p === "number" ? eur.format(p) : String(p ?? ""));
  const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/ß/g, "ss");
  const flach = (v) =>
    v == null ? "" : typeof v === "object" ? Object.values(v).map(flach).join(" ") : String(v);
  const liste = (v) => (Array.isArray(v) ? v.filter((x) => x != null && x !== "") : []);
  const datumDE = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || ""); return m ? `${m[3]}.${m[2]}.${m[1]}` : String(d || ""); };

  let warnNr = 0;
  const warnung = (t) => {
    const id = `warn-${++warnNr}`;
    return ` <span class="warn"><button type="button" class="warn-btn" aria-expanded="false" aria-controls="${id}" aria-label="Warnhinweis anzeigen">!</button><span class="warn-pop" id="${id}" role="dialog" hidden><strong>Achtung</strong>${t}</span></span>`;
  };
  const fmt = (t) => esc(t)
    .replace(/(\S*)\{!([^}]+)\}/g, (_, wort, w) => `<span class="nowrap">${wort}${warnung(w)}</span>`)
    .replace(/\{([^}]+)\}/g, '<span class="tbd">$1</span>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a class="link" href="$2" target="_blank" rel="noopener">$1</a>');
  const absaetze = (t, cls) =>
    t ? String(t).split(/\n\s*\n/).map((a) => `<p class="${cls}">${fmt(a.trim())}</p>`).join("") : "";
  const punkte = (items) =>
    `<ul class="bullets">${items.map((x) =>
      x && typeof x === "object"
        ? `<li>${fmt(x.text)}${x.warnung ? warnung(esc(x.warnung)) : ""}${liste(x.unter).length ? punkte(liste(x.unter)) : ""}</li>`
        : `<li>${fmt(x)}</li>`).join("")}</ul>`;

  const schliesseWarnungen = () =>
    view.querySelectorAll('.warn-btn[aria-expanded="true"]').forEach((b) => {
      b.setAttribute("aria-expanded", "false");
      document.getElementById(b.getAttribute("aria-controls")).hidden = true;
    });
  const platziere = (pop) => {
    pop.style.left = "-10px";
    const r = pop.getBoundingClientRect();
    const zuWeit = r.right - (document.documentElement.clientWidth - 16);
    if (zuWeit > 0) pop.style.left = `${-10 - zuWeit}px`;
  };

  function bildUrl(src) {
    if (!src) return "";
    if (!src.startsWith("data:")) return src;
    try {
      const komma = src.indexOf(",");
      const typ = (/data:([^;,]+)/.exec(src) || [])[1] || "image/jpeg";
      const bin = atob(src.slice(komma + 1));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: typ }));
      bildUrls.push(url);
      return url;
    } catch (e) { return src; }
  }

  const ICON = {
    lupe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
    chevron: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>',
    zurueck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  };

  /* ---------- Wissensdatei übernehmen ---------- */
  function pruefen(d) {
    return d && d.format === "moebelwissen" && Number.isInteger(d.version) &&
      Array.isArray(d.moebel) && Array.isArray(d.sektionen);
  }
  function anwenden(d) {
    bildUrls.forEach((u) => URL.revokeObjectURL(u));
    bildUrls = [];
    STAND = { version: d.version, datum: d.datum };
    SEKTIONEN = d.sektionen;
    MOEBEL = d.moebel.map((m) => {
      const { bild, ...rest } = m;
      return {
        ...m,
        _bild: bildUrl(bild),
        _such: norm(flach(rest) + " " + liste(m.preise).map((p) => preis(p.preis)).join(" ")),
      };
    });
  }

  /* ---------- Leiste oben ---------- */
  function leisteZeigen(m) {
    leiste.hidden = false;
    wrap.classList.add("mit-leiste");
    leisteTitel.textContent = m.titel;
    leiste.classList.remove("mit-titel");
    if (titelBeobachter) titelBeobachter.disconnect();
    const titel = view.querySelector(".d-title");
    if (titel && "IntersectionObserver" in window) {
      titelBeobachter = new IntersectionObserver(([e]) => leiste.classList.toggle("mit-titel", !e.isIntersecting), { rootMargin: "-60px 0px 0px 0px" });
      titelBeobachter.observe(titel);
    }
  }
  function leisteVerstecken() {
    leiste.hidden = true;
    wrap.classList.remove("mit-leiste");
    if (titelBeobachter) { titelBeobachter.disconnect(); titelBeobachter = null; }
  }

  /* ---------- Erster Start ---------- */
  function renderLeer() {
    state.ansicht = "leer";
    leisteVerstecken();
    view.innerHTML = `
      <section>
        <header>
          <h1 class="ov-title">Möbelwissen</h1>
          <p class="ov-sub">Was wir über jedes Stück wissen, für Beratung und Verkauf.</p>
        </header>
        <div class="leer-box">
          <p class="leer-text">Auf diesem Gerät ist noch kein Wissensstand gespeichert. Spiele die aktuelle Wissensdatei ein, die du von uns bekommen hast.</p>
          <button type="button" class="btn" data-aktion="import">Wissensdatei einspielen</button>
          <p class="leer-hint">Die Datei heißt zum Beispiel moebelwissen-v1-2026-11-10.json und liegt meist unter „Dateien“ oder „Downloads“.</p>
        </div>
      </section>`;
  }

  /* ---------- Übersicht ---------- */
  function renderUebersicht() {
    state.ansicht = "uebersicht";
    leisteVerstecken();
    const kats = ["Alle", ...new Set(MOEBEL.map((m) => m.kategorie).filter(Boolean))];
    if (!kats.includes(state.kat)) state.kat = "Alle";
    const proKat = {};
    MOEBEL.forEach((m) => { if (m.kategorie) proKat[m.kategorie] = (proKat[m.kategorie] || 0) + 1; });
    const filterSinnvoll = Object.values(proKat).some((n) => n > 1);
    if (!filterSinnvoll) state.kat = "Alle";
    const offen = MOEBEL.filter((m) => m.platzhalter).length;
    view.innerHTML = `
      <section class="overview">
        <header>
          <h1 class="ov-title">Möbelwissen</h1>
          <p class="ov-sub">Was wir über jedes Stück wissen, für Beratung und Verkauf.</p>
        </header>
        <div class="tools">
          <div class="search">
            ${ICON.lupe}
            <label class="sr" for="suche">Möbelwissen durchsuchen</label>
            <input id="suche" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search"
              placeholder="Suchen: Holz, Feature, Maß …" value="${esc(state.q)}">
          </div>
          ${filterSinnvoll ? `<div class="chips" role="group" aria-label="Nach Kategorie filtern">
            ${kats.map((k) => `<button type="button" class="chip" data-kat="${esc(k)}" aria-pressed="${k === state.kat}">${esc(k)}</button>`).join("")}
          </div>` : ""}
        </div>
        <div class="meta-row">
          <p class="count" id="anzahl" aria-live="polite"></p>
          ${offen ? `<p class="notice">Bei ${offen} von ${MOEBEL.length} Möbeln stehen noch Platzhalter-Inhalte.</p>` : ""}
        </div>
        <ul class="grid" id="raster"></ul>
        <footer class="stand">
          ${ENTWURF
            ? `<span>Entwurf für <strong>Version ${esc(STAND.version)}</strong>. Die Wissensdatei wird erst erzeugt, wenn du ihn freigibst.</span>`
            : `<span>Stand: <strong>Version ${esc(STAND.version)}</strong> vom ${esc(datumDE(STAND.datum))}</span>
          <button type="button" class="textbtn" data-aktion="import">Wissensdatei aktualisieren</button>`}
        </footer>
      </section>`;
    renderRaster();
  }

  function renderRaster() {
    const raster = document.getElementById("raster");
    const anzahl = document.getElementById("anzahl");
    if (!raster) return;
    const woerter = norm(state.q.trim()).split(/\s+/).filter(Boolean);
    const treffer = MOEBEL.filter(
      (m) => (state.kat === "Alle" || m.kategorie === state.kat) && woerter.every((w) => m._such.includes(w))
    );
    const gefiltert = woerter.length > 0 || state.kat !== "Alle";
    anzahl.textContent = gefiltert ? `${treffer.length} von ${MOEBEL.length} Möbeln` : `${MOEBEL.length} Möbel`;
    raster.innerHTML = treffer.length
      ? treffer.map(kachel).join("")
      : `<li class="none">Kein Möbel passt zu „${esc(state.q.trim() || state.kat)}“.</li>`;
  }

  function kachel(m) {
    const bild = m._bild
      ? `<img src="${esc(m._bild)}" alt="" loading="lazy">`
      : `<span class="ph" aria-hidden="true"><span>Bild folgt</span></span>`;
    return `<li><a class="tile" href="#${encodeURIComponent(m.id)}">
      ${bild}
      <span class="tile-text">
        <span class="tile-name">${esc(m.titel)}</span>
        ${m.kategorie ? `<span class="tile-cat">${esc(m.kategorie)}</span>` : ""}
      </span></a></li>`;
  }

  /* ---------- Detailseite ---------- */
  function renderDetail(i) {
    state.ansicht = "detail";
    const m = MOEBEL[i];
    const preise = liste(m.preise);
    const masse = liste(m.masse);
    const konf = liste(m.konfiguration);

    view.innerHTML = `
      <article class="detail">
        <header>
          <h1 class="d-title">${esc(m.titel)}</h1>
          ${m.kategorie ? `<p class="d-cat">${esc(m.kategorie)}</p>` : ""}
          ${m.platzhalter ? `<p class="d-note">Hier stehen noch Platzhalter. Die echten Inhalte folgen.</p>` : ""}
          ${m.hinweis ? `<p class="d-note">${esc(m.hinweis)}</p>` : ""}
        </header>

        <div class="cards">
          <figure class="card card-img${m._bild ? " mit-bild" : ""}">
            ${m._bild ? `<img src="${esc(m._bild)}" alt="${esc(m.titel)}">` : `<span class="ph-detail">Bild folgt</span>`}
          </figure>

          <div class="card">
            <div class="pricegrid">
              <ul class="prices" aria-label="Preise">
                ${preise.length
                  ? preise.map((p) => `<li><span class="price">${fmt(preis(p.preis))}</span>${p.holz ? `<span class="price-label">${esc(p.holz)}</span>` : ""}</li>`).join("")
                  : `<li class="empty">Preise noch nicht erfasst.</li>`}
              </ul>
              <ul class="dims" aria-label="Maße">
                ${masse.length ? masse.map((x) => `<li>${fmt(x).replace(/(\d) (?=(?:cm|mm|m)\b)/g, "$1&nbsp;")}</li>`).join("") : '<li><span class="tbd">Maße folgen</span></li>'}
              </ul>
            </div>
          </div>

          <div class="card">
            <h2 class="card-h">Konfigurations&shy;möglichkeiten</h2>
            ${konf.length ? punkte(konf) : `<p class="empty">Noch nicht erfasst.</p>`}
          </div>
        </div>

        <div class="sections">
          ${SEKTIONEN.map((s) => sektion(s, m)).join("")}
        </div>

        <nav class="pager" aria-label="Zurück zur Übersicht">
          <a class="back" href="#">${ICON.zurueck}Zurück zu allen Möbeln</a>
        </nav>
      </article>`;
    leisteZeigen(m);
  }

  /* Fertigung: Zusammenfassung + ausklappbarer Volltext (Teile → Gruppen → Punkte) */
  function ablauf(a) {
    const teile = liste(a.teile);
    const details = teile.map((t) => {
      const gruppen = liste(t.gruppen);
      const ohneTitel = gruppen.filter((g) => !g.titel);
      const mitTitel = gruppen.filter((g) => g.titel);
      return `<div class="teil">
        ${t.titel ? `<h3 class="teil-h">${fmt(t.titel)}</h3>` : ""}
        ${ohneTitel.map((g) => punkte(liste(g.punkte))).join("")}
        ${mitTitel.length ? `<ol class="steps">${mitTitel.map((g, n) => `
          <li class="step">
            <span class="step-num" aria-hidden="true">${n + 1}</span>
            <div>
              <h4 class="step-name">${fmt(g.titel)}</h4>
              <div class="step-text">${punkte(liste(g.punkte))}</div>
            </div>
          </li>`).join("")}</ol>` : ""}
      </div>`;
    }).join("");
    const argumente = liste(a.argumente);
    return `${absaetze(a.kurz, "ablauf-kurz")}
      ${argumente.length ? `<div class="argument"><span class="argument-label">Verkaufsargument</span>${argumente.map((t) => `<p>${fmt(t)}</p>`).join("")}</div>` : ""}
      ${teile.length ? `<details class="ablauf"><summary>${ICON.chevron}<span>Alle Fertigungsschritte</span></summary><div class="ablauf-inhalt">${details}</div></details>` : ""}`;
  }

  function sektion(s, m) {
    if (m[s.key] === null) return ""; /* null = Sektion bewusst weggelassen */
    const wert = m[s.key];
    const daten = liste(wert);
    const zu = state.zu.has(s.key);
    let inhalt;
    if (wert && typeof wert === "object" && !Array.isArray(wert)) {
      inhalt = ablauf(wert);
    } else if (!daten.length) {
      inhalt = `<p class="empty">Noch nicht erfasst.</p>`;
    } else if (s.art === "schritte") {
      inhalt = `<ol class="steps">${daten.map((x, n) => `
        <li class="step">
          <span class="step-num" aria-hidden="true">${n + 1}</span>
          <div>
            <h3 class="step-name">${fmt(x.name)}</h3>
            ${absaetze(x.text, "step-text")}
          </div>
        </li>`).join("")}</ol>`;
    } else if (s.art === "eintraege") {
      inhalt = `<ul class="entries">${daten.map((x, n) => {
        const infoId = `info-${s.key}-${n}`;
        return `
        <li class="entry">
          <div class="entry-head">
            ${x.name ? `<h3 class="entry-name">${fmt(x.name)}</h3>` : ""}
            ${x.info ? `<button type="button" class="info-btn" aria-expanded="false" aria-controls="${infoId}" aria-label="Was ist ${esc(String(x.name).replace(/[{}]/g, ""))}?">?</button>` : ""}
            ${x.nur ? `<span class="tag">nur ${esc(x.nur)}</span>` : ""}
          </div>
          ${x.info ? `<div class="info-pop" id="${infoId}" hidden>${fmt(x.info)}</div>` : ""}
          ${absaetze(x.text, "entry-text")}
        </li>`;
      }).join("")}</ul>`;
    } else {
      inhalt = punkte(daten);
    }
    return `
      <section class="sec${zu ? " is-collapsed" : ""}" data-sec="${esc(s.key)}">
        <h2 class="sec-h">
          <button type="button" class="sec-toggle" aria-expanded="${!zu}" aria-controls="sec-${esc(s.key)}">
            <span>${esc(s.titel)}</span>${ICON.chevron}
          </button>
        </h2>
        <div class="sec-panel" id="sec-${esc(s.key)}">
          <div class="sec-inner"${zu ? " inert" : ""}><div class="sec-content">${inhalt}</div></div>
        </div>
      </section>`;
  }

  /* ---------- Dialog und Rückmeldung ---------- */
  let dialogAktion = null;
  function dialog({ titel, text, bestaetigen, abbrechen }) {
    document.getElementById("modal-titel").textContent = titel;
    document.getElementById("modal-text").innerHTML = text;
    const aktionen = document.getElementById("modal-aktionen");
    aktionen.innerHTML =
      (abbrechen ? `<button type="button" class="btn btn-ghost" data-dialog="nein">${esc(abbrechen)}</button>` : "") +
      `<button type="button" class="btn" data-dialog="ja">${esc(bestaetigen)}</button>`;
    modal.hidden = false;
    document.getElementById("modal-card").focus();
    return new Promise((ok) => { dialogAktion = ok; });
  }
  modal.addEventListener("click", (e) => {
    const b = e.target.closest("[data-dialog]");
    if (!b && e.target !== modal) return;
    modal.hidden = true;
    const f = dialogAktion; dialogAktion = null;
    if (f) f(b ? b.dataset.dialog === "ja" : false);
  });

  let toastTimer = null;
  function toast(text) {
    toastEl.textContent = text;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3800);
  }

  /* ---------- Import ---------- */
  const standText = (v, d) => `Version ${esc(v)} vom ${esc(datumDE(d))}`;
  async function importieren(datei) {
    let neu;
    try { neu = JSON.parse(await datei.text()); } catch (e) { neu = null; }
    if (!pruefen(neu)) {
      await dialog({ titel: "Keine Wissensdatei", text: "Diese Datei kann die App nicht lesen. Bitte nimm die Datei, die mit „moebelwissen-“ beginnt und auf „.json“ endet.", bestaetigen: "Verstanden" });
      return;
    }
    if (STAND) {
      if (neu.version === STAND.version) {
        await dialog({ titel: "Schon aktuell", text: `Auf diesem Gerät ist bereits ${standText(STAND.version, STAND.datum)} eingespielt.`, bestaetigen: "Gut" });
        return;
      }
      if (neu.version < STAND.version) {
        await dialog({ titel: "Ältere Datei", text: `Diese Datei ist älter als der Stand auf diesem Gerät und wird nicht eingespielt.<span class="vergleich">Auf dem Gerät: ${standText(STAND.version, STAND.datum)}<br>Datei: ${standText(neu.version, neu.datum)}</span>`, bestaetigen: "Verstanden" });
        return;
      }
      const ja = await dialog({
        titel: "Wissensstand aktualisieren?",
        text: `<span class="vergleich">${standText(STAND.version, STAND.datum)}<br>→ ${standText(neu.version, neu.datum)}</span>`,
        bestaetigen: "Einspielen", abbrechen: "Abbrechen",
      });
      if (!ja) return;
    }
    let dauerhaft = true;
    try { await standSpeichern(neu); } catch (e) { dauerhaft = false; }
    anwenden(neu);
    state.scrollY = 0;
    if (location.hash) location.hash = ""; else route();
    toast(dauerhaft
      ? `Version ${neu.version} vom ${datumDE(neu.datum)} eingespielt.`
      : "Eingespielt, aber auf diesem Gerät nicht dauerhaft gespeichert.");
  }
  dateiInput.addEventListener("change", () => {
    const d = dateiInput.files && dateiInput.files[0];
    dateiInput.value = "";
    if (d) importieren(d);
  });

  /* ---------- Interaktion ---------- */
  view.addEventListener("input", (e) => {
    if (e.target.id === "suche") { state.q = e.target.value; renderRaster(); }
  });

  view.addEventListener("click", (e) => {
    if (e.target.closest('[data-aktion="import"]')) { dateiInput.click(); return; }
    const warnBtn = e.target.closest(".warn-btn");
    if (warnBtn) {
      const offen = warnBtn.getAttribute("aria-expanded") === "true";
      schliesseWarnungen();
      if (!offen) {
        const pop = document.getElementById(warnBtn.getAttribute("aria-controls"));
        warnBtn.setAttribute("aria-expanded", "true");
        pop.hidden = false;
        platziere(pop);
      }
      return;
    }
    const chip = e.target.closest(".chip");
    if (chip) {
      state.kat = chip.dataset.kat;
      view.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", String(c === chip)));
      renderRaster();
      return;
    }
    const toggle = e.target.closest(".sec-toggle");
    if (toggle) {
      const sec = toggle.closest(".sec");
      const key = sec.dataset.sec;
      const jetztZu = !sec.classList.contains("is-collapsed");
      sec.classList.toggle("is-collapsed", jetztZu);
      toggle.setAttribute("aria-expanded", String(!jetztZu));
      sec.querySelector(".sec-inner").inert = jetztZu;
      jetztZu ? state.zu.add(key) : state.zu.delete(key);
      zuSpeichern();
      return;
    }
    const info = e.target.closest(".info-btn");
    if (info) {
      const pop = document.getElementById(info.getAttribute("aria-controls"));
      const offen = info.getAttribute("aria-expanded") === "true";
      info.setAttribute("aria-expanded", String(!offen));
      pop.hidden = offen;
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    schliesseWarnungen();
    if (!modal.hidden) modal.click();
  });
  document.addEventListener("click", (e) => { if (!e.target.closest(".warn-btn, .warn-pop")) schliesseWarnungen(); });

  /* ---------- Navigation über den Link-Anker ---------- */
  function route() {
    if (!STAND) { renderLeer(); return; }
    const id = decodeURIComponent(location.hash.slice(1));
    const i = MOEBEL.findIndex((m) => m.id === id);
    if (i >= 0) {
      if (state.ansicht === "uebersicht") state.scrollY = window.scrollY;
      renderDetail(i);
      window.scrollTo(0, 0);
    } else {
      const zurueck = state.ansicht === "detail";
      renderUebersicht();
      window.scrollTo(0, zurueck ? state.scrollY : 0);
    }
  }
  window.addEventListener("hashchange", route);

  /* ---------- Start ---------- */
  (async () => {
    const entwurfEl = document.getElementById("entwurf");
    if (entwurfEl) {
      try {
        const d = JSON.parse(entwurfEl.textContent);
        if (pruefen(d)) {
          ENTWURF = true;
          anwenden(d);
          const band = document.getElementById("band");
          band.textContent = `Vorschau · Entwurf für Version ${d.version} · noch keine Wissensdatei`;
          band.hidden = false;
        }
      } catch (e) {}
    }
    if (!ENTWURF) {
      const gespeichert = await standLaden();
      if (pruefen(gespeichert)) anwenden(gespeichert);
    }
    route();
  })();
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
</script>
